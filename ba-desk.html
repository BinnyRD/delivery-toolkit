<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Business analysis workbench: requirements, stories, gaps, tests, traceability and a specification export.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BA Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: analyst’s workbench: requirements spine with stories, gaps, tests and questions hanging off it */
:root{--bg:#F2EFF1; --surface:#FFFFFF; --sunk:#F8F6F7; --ink:#1B1419; --muted:#655A61; --faint:#978C93; --line:#E2DCE0; --red:#C2342A; --red-soft:#FBE7E5; --amber:#B7790A; --amber-soft:#FCF1DA; --green:#1F7D53; --green-soft:#E0F2E9; --accent:#8E2F57; --accent-soft:#F6E3EB; --accent-ink:#FFFFFF;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#140F13; --surface:#1D161B; --sunk:#181216; --ink:#EEE6EB; --muted:#AB9CA5; --faint:#7B6D75; --line:#33292F; --red:#F2685D; --red-soft:#3A1B1C; --amber:#EFB23C; --amber-soft:#3A2D12; --green:#4BC48B; --green-soft:#12301F; --accent:#E78AB1; --accent-soft:#3B1B29; --accent-ink:#140F13; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140F13; --surface:#1D161B; --sunk:#181216; --ink:#EEE6EB; --muted:#AB9CA5; --faint:#7B6D75; --line:#33292F; --red:#F2685D; --red-soft:#3A1B1C; --amber:#EFB23C; --amber-soft:#3A2D12; --green:#4BC48B; --green-soft:#12301F; --accent:#E78AB1; --accent-soft:#3B1B29; --accent-ink:#140F13; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:28px;font-weight:700;line-height:1.15}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.label{font-family:var(--f-display);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;align-items:start}
.side{position:sticky;top:max(16px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700}
.brand .sub{font-size:12px;color:var(--muted);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.nav .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nav .count.hot{color:var(--accent);font-weight:600}
.mode{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.mode b{display:block;color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 12px;border-radius:6px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.head .sub{margin-top:4px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.banner{border:1px dashed var(--faint);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:13px}
.banner b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .big{font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi .note{font-size:12.5px;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.pill.r{color:var(--red);background:var(--red-soft)} .pill.a{color:var(--amber);background:var(--amber-soft)} .pill.g{color:var(--green);background:var(--green-soft)}
.pill.lg{font-size:14px;padding:5px 12px 5px 9px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.dot.r{background:var(--red)}.dot.a{background:var(--amber)}.dot.g{background:var(--green)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.r{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line));background:var(--red-soft)}
.chip.a{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,var(--line));background:var(--amber-soft)}
.chip.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,var(--line));background:var(--green-soft)}
.chip.ac{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.nowrap{white-space:nowrap}
tr.done td{color:var(--faint)}
tr.editing td{background:var(--accent-soft)}
.t-main{font-weight:500}
.t-sub{font-size:12.5px;color:var(--muted)}
.late{color:var(--red);font-weight:500}
.reasons{display:flex;flex-direction:column;gap:9px}
.reason{display:grid;grid-template-columns:auto 104px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13.5px}
.reason .area{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
form{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.fgrid .s2{grid-column:span 2}.fgrid .s4{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font-size:12.5px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--faint)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--faint)}
textarea{resize:vertical;min-height:64px}
[aria-invalid=true]{border-color:var(--red)!important}
.err{color:var(--red);font-size:12.5px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.checkf{flex-direction:row;align-items:center;gap:8px;padding-top:24px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.editor{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content;max-width:100%;background:var(--surface)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:5px 10px;font-family:var(--f-mono);font-size:13px;border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid4q{display:grid;grid-template-columns:28px repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,auto) 22px;gap:8px}
.q{border:1px solid var(--line);border-radius:6px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.q .qt{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q .names{display:flex;flex-wrap:wrap;gap:4px}
.axis{font-size:11.5px;color:var(--faint);display:flex;align-items:center;justify-content:center;letter-spacing:.06em;text-transform:uppercase}
.axis.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;max-width:860px}
textarea.copybox{font-family:var(--f-mono);font-size:12px;min-height:220px}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{max-width:52ch;color:var(--muted)}
.skel{height:14px;border-radius:4px;background:var(--sunk)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:13.5px;max-width:min(520px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:20}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid .s2{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav a{white-space:nowrap}
  .mode{display:none}
}
@media (max-width:520px){
  .kpis{grid-template-columns:minmax(0,1fr)}.fgrid{grid-template-columns:minmax(0,1fr)}
  .reason{grid-template-columns:auto minmax(0,1fr)}.reason .area{grid-column:2}.reason .txt{grid-column:2}
  .paper{padding:18px} h1{font-size:24px}
  .checkf{padding-top:0}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.tab{transition:background-color .12s,border-color .12s,color .12s}}
.localbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.checks{display:flex;flex-direction:column;gap:3px;min-width:180px}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.pre{white-space:pre-line;margin-top:4px}
.asis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:260px}
.asis .label{font-size:10.5px}
.refs{display:flex;flex-wrap:wrap;gap:4px}
.spec h2{font-size:22px;margin:0 0 6px}
.spec h3{font-size:17px;margin:20px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.spec h4{font-family:var(--f-display);font-size:14.5px;margin:14px 0 4px}
.spec p{margin:0 0 6px;max-width:75ch}
.spec ul{margin:0 0 8px;padding-left:20px}
.spec table{font-size:13px}
@media (max-width:520px){.asis{grid-template-columns:minmax(0,1fr);min-width:0}}

</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="brand-mark" aria-hidden="true">BA</div><div><b>BA Desk</b><div class="sub" id="brand-sub"></div></div></div><nav class="nav" id="nav" aria-label="Sections"></nav><div class="mode" id="mode"></div></aside><main id="main" aria-live="polite"></main></div>
<div id="toast" role="status" hidden></div>
<script>
/* ---------- Browser storage for standalone use (opened as a file or hosted outside Claude) ---------- */
var LOCAL = {
  key:null, ok:null,
  read:function(){ try { var s = window.localStorage.getItem(this.key); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  write:function(obj){ try { window.localStorage.setItem(this.key, JSON.stringify(obj)); this.ok = true; } catch(e){ this.ok = false; } return this.ok; },
  fileSaver:function(){ return {save:function(o){ return new Promise(function(res, rej){
    try {
      var blob = new Blob([o.data], {type:(o.type || 'text/plain') + ';charset=utf-8'}), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = o.filename; a.rel = 'noopener'; a.style.display = 'none'; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500); res({status:'saved'});
    } catch(e){ rej({code:'unavailable'}); }
  }); }}; },
  readFile:function(file){ return new Promise(function(res, rej){
    if (!file) return rej(new Error('Choose a backup file first.'));
    if (file.size > 5e6) return rej(new Error('That file is too large to be a backup.'));
    var r = new FileReader();
    r.onload = function(){ try { res(JSON.parse(r.result)); } catch(e){ rej(new Error('That file isn’t a valid backup.')); } };
    r.onerror = function(){ rej(new Error('Couldn’t read that file.')); };
    r.readAsText(file);
  }); },
  cleanList:function(arr){ return (Array.isArray(arr) ? arr : []).filter(function(x){ return x && typeof x === 'object' && !Array.isArray(x) && typeof x.id === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(x.id); }); },
  slug:function(s){ return String(s || 'backup').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); },
  banner:function(armed, canBackup){
    return '<div class="banner localbar"><span><b>Saved in this browser.</b> Changes stay on this computer only' +
      (LOCAL.ok === false ? '. <b>This browser is blocking storage, so back up before you close the page.</b>' : '. Back up to keep a copy or move it to another computer.') + '</span><span class="row">' +
      (canBackup ? '<button class="btn sm" data-act="data-backup">Back up</button>' : '') +
      '<label class="btn sm" for="data-restore">Restore</label><input type="file" id="data-restore" accept=".json,application/json" data-act="data-restore" class="sr">' +
      '<button class="btn sm' + (armed === 'reset:sample' ? ' danger armed' : ' ghost') + '" data-act="data-reset" data-v="sample" data-arm>' + (armed === 'reset:sample' ? 'Confirm: replace with sample' : 'Load sample') + '</button>' +
      '<button class="btn sm danger' + (armed === 'reset:empty' ? ' armed' : ' ghost') + '" data-act="data-reset" data-v="empty" data-arm>' + (armed === 'reset:empty' ? 'Confirm: delete everything' : 'Start empty') + '</button></span></div>';
  }
};

/* ---------- Desk kit: utilities, live/demo storage, schema-driven records ---------- */
var K = (function(){
'use strict';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
function parseDate(s){
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  var p = s.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  return d.getMonth() === p[1] - 1 ? d : null;
}
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function today(){ return startOfDay(new Date()); }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b){ return Math.round((startOfDay(b) - startOfDay(a)) / 864e5); }
var DF = new Intl.DateTimeFormat('en-NZ', {day:'numeric', month:'short', year:'numeric'});
var DFS = new Intl.DateTimeFormat('en-NZ', {day:'numeric', month:'short'});
function fmtDate(d){ var x = d instanceof Date ? d : parseDate(d); return x ? DF.format(x) : '—'; }
function fmtShort(d){ var x = d instanceof Date ? d : parseDate(d); return x ? DFS.format(x) : '—'; }
var NZD = new Intl.NumberFormat('en-NZ', {style:'currency', currency:'NZD', maximumFractionDigits:0});
function nzd(v){ return NZD.format(num(v)); }
function nzdShort(v){ v = num(v); var a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e4) return s + '$' + Math.round(a / 1e3) + 'k';
  return s + NZD.format(a); }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function pad2(n){ return String(n || 0).padStart(2, '0'); }
var LV = ['g', 'a', 'r'], LV_NAME = ['Green', 'Amber', 'Red'];
function pill(lvl, big){ return '<span class="pill ' + LV[lvl] + (big ? ' lg' : '') + '">' + LV_NAME[lvl] + '</span>'; }
function $(s, r){ return (r || document).querySelector(s); }

var S = {data:{}, docs:{}, mode:'loading', canWrite:true, wroteOnce:false, ready:{}, dirty:false, pending:false,
  editing:{}, armed:null, downloads:null, ui:{}};
var CFG = null, DB = null, chains = {}, DEFS = {};

/* ---- storage ---- */
function queue(path, fn){ var p = (chains[path] || Promise.resolve()).catch(function(){}).then(fn); chains[path] = p; return p; }
function retryOnce(fn){ return fn().catch(function(e){
  if (e && e.code === 'unavailable') return new Promise(function(r){ setTimeout(r, 400 + Math.random() * 600); }).then(fn);
  throw e; }); }
function onWriteError(e){
  var c = e && e.code;
  if (c === 'invalid_argument' && !S.wroteOnce){ S.canWrite = false; toast('You can view this desk but not change it. Ask the owner for Contributor access.'); render(); }

/* Quality checks per record. lvl 2 = must fix, 1 = should fix. */
function reqChecks(r, ix, today){

  if (!String(r.acceptance || '').trim()) out.push({lvl:crit ? 2 : 1, text:'No acceptance criteria'});
  var v = vagueWords(r.title + ' ' + (r.acceptance || ''));
  if (v.length) out.push({lvl:1, text:'Vague wording: ' + v.map(function(w){ return '“' + w + '”'; }).join(', ')});

  if (!String(r.source || '').trim()) out.push({lvl:1, text:'No source recorded'});
  if (r.status === 'Approved' && !(ix.stories[r.id] || []).length) out.push({lvl:1, text:'Approved but no user story delivers it'});
  var tests = ix.tests[r.id] || [];
  if (r.status === 'Approved' && (r.priority === 'Must' || r.priority === 'Should') && !tests.length) out.push({lvl:1, text:'No test case'});
  var fail = tests.filter(function(t){ return t.status === 'Fail'; });

  if (num(s.points) >= 13) out.push({lvl:1, text:'Estimate is ' + s.points + ' points; split it before it goes in a sprint'});

    {h:'RACI', v:function(s){ return chip(s.raci, s.raci === 'Accountable' ? 'ac' : ''); }},
    {h:'Signs off', v:function(s){ return s.signoff ? chip('Yes', 'ac') : '<span class="faint">—</span>'; }},
    {h:'Infl / Int', cls:'nowrap', v:function(s){ return '<span class="num">' + num(s.influence) + ' / ' + num(s.interest) + '</span><div class="t-sub">' + Q[quad(s)][0] + '</div>'; }},
    {h:'Needs', v:function(s){ return '<span class="small">' + esc(s.needs || '') + '</span>'; }}
  ];
  return head('Stakeholders', 'Who you elicit from, who is consulted, and who signs off') + grid + K.records('stakeholders', {title:'Register', items:all, cols:cols});
}

/* ---- Questions ---- */
function questions(){
  var t = K.today(), f = S.ui.qF || 'Open', all = S.data.questions.slice().sort(function(a, b){ return String(a.due || '9').localeCompare(String(b.due || '9')); });
  var counts = {Open:all.filter(function(q){ return q.status !== 'Answered'; }).length, Answered:all.filter(function(q){ return q.status === 'Answered'; }).length, All:all.length};
  var items = all.filter(function(q){ return f === 'All' || (f === 'Open' ? q.status !== 'Answered' : q.status === 'Answered'); });
  var cols = [
    {h:'Ref', v:function(q){ return '<span class="mono">' + esc(ref('questions', q)) + '</span>'; }},
    {h:'Question', v:function(q){ return '<div class="t-main">' + esc(q.question) + '</div>' + (q.answer ? '<div class="t-sub"><b>Answer:</b> ' + esc(q.answer) + '</div>' : ''); }},
    {h:'Asked of', v:function(q){ return esc(q.askedOf || '—'); }},
    {h:'Needed by', cls:'nowrap', v:function(q){ var d = K.parseDate(q.due); return '<span class="num' + (q.status !== 'Answered' && d && d < t ? ' late' : '') + '">' + K.fmtDate(q.due) + '</span>'; }},
    {h:'Affects', v:function(q){ return refLink('requirements', q.reqRef, 'requirements'); }},
    {h:'Status', v:function(q){ return stat(q.status); }}
  ];
  return head('Open questions', 'Assumptions to confirm and decisions you’re waiting on') +
    K.records('questions', {title:'Question log', items:items, cols:cols, tools:tabs('qF', ['Open','Answered','All'], counts), addLabel:'Log question',
      rowActions:function(q){ return S.canWrite && q.status !== 'Answered' ? '<button class="btn ghost sm" data-act="ent-edit" data-coll="questions" data-id="' + esc(q.id) + '">Answer</button>' : ''; }});
}

/* ---- Export ---- */
function mdToHtml(md){
  var out = [], inList = false, inTable = false;
  var inline = function(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); };
  md.split('\n').forEach(function(line){
    var l = line.replace(/\s+$/, '');
    if (/^\|/.test(l)){
      if (/^\|[-| ]+\|$/.test(l)) return;
      var cells = l.slice(1, -1).split('|').map(function(c){ return c.trim(); });
      if (!inTable){ out.push('<table style="border-collapse:collapse;margin:6px 0 12px">'); inTable = true; out.push('<tr>' + cells.map(function(c){ return '<th style="text-align:left;border-bottom:1px solid #ccc;padding:4px 10px 4px 0">' + inline(c) + '</th>'; }).join('') + '</tr>'); }
      else out.push('<tr>' + cells.map(function(c){ return '<td style="padding:4px 10px 4px 0;border-bottom:1px solid #eee">' + inline(c) + '</td>'; }).join('') + '</tr>');
      return;
    } else if (inTable){ out.push('</table>'); inTable = false; }
    if (/^- /.test(l)){ if (!inList){ out.push('<ul>'); inList = true; } out.push('<li>' + inline(l.slice(2)) + '</li>'); return; }
    if (inList){ out.push('</ul>'); inList = false; }
    var m = /^(#{1,3}) (.*)$/.exec(l);
    if (m){ out.push('<h' + (m[1].length + 1) + '>' + inline(m[2]) + '</h' + (m[1].length + 1) + '>'); return; }
    if (/^> /.test(l)){ out.push('<p style="margin:0 0 0 14px;color:#655A61">' + inline(l.slice(2)) + '</p>'); return; }
    if (l) out.push('<p>' + inline(l) + '</p>');
  });
  if (inList) out.push('</ul>'); if (inTable) out.push('</table>');
  return out.join('\n');
}
function exportView(){
  var np = needProject(); if (np) return np;
  var md = BA.exportMarkdown(D());
  return head('Export specification', 'A requirements specification built from everything on this desk',
    '<button class="btn primary" data-act="copy-doc">Copy for Word / Confluence</button><button class="btn" data-act="copy-md">Copy as Markdown</button>' + (S.downloads ? '<button class="btn" data-act="save-md">Save .md file</button>' : '')) +
    '<div class="paper spec">' + mdToHtml(md) + '</div>' + K.copyBox();
}

/* ---- actions ---- */
function onAct(act, el){
  var id = el.getAttribute('data-id');
  if (act === 'req-next'){ var r = K.find('requirements', id); if (!r) return; var nr = K.clone(r); nr.status = r.status === 'Draft' ? 'In review' : 'Approved'; K.save('requirements', id, nr); K.toast(ref('requirements', nr) + ' is now ' + nr.status.toLowerCase() + '.'); K.render(); }
  else if (act === 'story-ready'){ var s = K.find('stories', id); if (!s) return; var ns = K.clone(s); ns.status = 'Ready'; K.save('stories', id, ns); K.toast(ref('stories', ns) + ' is ready for a sprint.'); K.render(); }
  else if (act === 'tc-set'){ var t = K.find('tests', id); if (!t) return; var nt = K.clone(t); nt.status = el.getAttribute('data-v'); nt.runDate = K.iso(K.today()); K.save('tests', id, nt); K.toast(ref('tests', nt) + ' marked ' + nt.status.toLowerCase() + '.' + (nt.status === 'Fail' ? ' Add the defect reference with Edit.' : '')); K.render(); }
  else if (act === 'gap-req'){
    var g = K.find('gaps', id); if (!g) return;
    var rec = {title:(g.gap || g.future || g.process).slice(0, 240), type:'Functional', priority:g.impact === 'High' ? 'Must' : 'Should', status:'Draft', source:'Gap analysis ' + ref('gaps', g), acceptance:'', rationale:'Closes ' + ref('gaps', g) + ': ' + g.process, created:K.iso(K.today()), seq:K.nextSeq('requirements')};
    var rid = K.uid('re'); K.save('requirements', rid, rec);
    var ng = K.clone(g); ng.reqRef = rid; K.save('gaps', id, ng);
    K.toast(ref('requirements', rec) + ' created from ' + ref('gaps', g) + '. Add acceptance criteria next.');
    S.ui.openAfterNav = {coll:'requirements', id:rid}; location.hash = '#requirements';
  }
  else if (act === 'focus'){ /* plain link navigation */ }
  else if (act === 'goto-edit'){ S.ui.openAfterNav = {coll:el.getAttribute('data-coll'), id:id}; location.hash = '#' + el.getAttribute('data-goto'); }
  else if (act === 'copy-trace'){ K.copy(traceText(), null, 'Matrix copied. Paste into Excel or a table.'); }
  else if (act === 'copy-md' || act === 'copy-doc'){ var md = BA.exportMarkdown(D()); K.copy(md, act === 'copy-doc' ? '<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;line-height:1.5">' + mdToHtml(md) + '</div>' : null, act === 'copy-doc' ? 'Copied with formatting. Paste into Word or Confluence.' : 'Markdown copied.'); }
  else if (act === 'save-md'){ var p = P() || {}; K.download(String(p.code || p.name || 'requirements').replace(/[^A-Za-z0-9-]+/g, '-').toLowerCase() + '-requirements.md', BA.exportMarkdown(D())); }
  else return false;
}
function onSubmit(kind, form){
  if (kind !== 'setup' && kind !== 'project') return;
  var v = function(n){ return form.elements[n] ? String(form.elements[n].value).trim() : ''; };
  var cur = K.clone(P()) || {}, errId = kind === 'setup' ? 'su-err' : 'pj-err';
  ['name','ba','sponsor','inScope','outScope'].forEach(function(f){ if (form.elements[f]) cur[f] = v(f); });
  var bad = []; if (!cur.name) bad.push('name'); if (kind === 'setup' && !cur.ba) bad.push('ba');
  if (bad.length){ K.markInvalid(form, bad); var e = K.$('#' + errId); e.textContent = bad[0] === 'name' ? 'Give the project a name.' : 'Add the business analyst.'; e.hidden = false; return; }
  cur.phase = cur.phase || 'Analysis'; cur.updated = new Date().toISOString();
  S.dirty = false; S.pending = false;
  K.saveDoc('project/main', cur).then(function(ok){ if (ok) K.toast(kind === 'setup' ? 'BA desk created. Start with stakeholders or requirements.' : 'Scope saved.'); });
  K.render();
}

K.setup({
  title:'BA Desk',
  collections:['requirements','stories','gaps','tests','stakeholders','questions'],
  docs:['project/main'],
  sample:baSample,
  brandSub:function(){ var p = P(); return p ? p.name : 'Requirements to sign-off'; },
  routes:[
    {v:'overview', label:'Overview', count:function(){ return P() ? K.LV_NAME[BA.health(D()).lvl] : ''; }},
    {v:'requirements', label:'Requirements', count:function(){ return S.data.requirements.length; }},
    {v:'stories', label:'User stories', count:function(){ return S.data.stories.length; }},
    {v:'gaps', label:'Process gaps', count:function(){ return S.data.gaps.length; }},
    {v:'tests', label:'Test cases', count:function(){ var f = S.data.tests.filter(function(t){ return t.status === 'Fail'; }).length; return f ? f + ' fail' : S.data.tests.length; }, hot:function(){ return S.data.tests.some(function(t){ return t.status === 'Fail'; }); }},
    {v:'trace', label:'Traceability'},
    {v:'stakeholders', label:'Stakeholders', count:function(){ return S.data.stakeholders.length; }},
    {v:'questions', label:'Open questions', count:function(){ return S.data.questions.filter(function(q){ return q.status !== 'Answered'; }).length || ''; }, hot:function(){ return true; }},
    {v:'export', label:'Export spec'}
  ],
  views:{overview:overview, requirements:requirements, stories:stories, gaps:gaps, tests:tests, trace:trace, stakeholders:stakeholders, questions:questions, export:exportView},
  onAct:onAct, onSubmit:onSubmit
});
})();
